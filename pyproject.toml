[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-automation-agent"
version = "0.1.0"
description = "AI accounts payable and accounts receivable assistant with human review (synthetic data only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "sqlalchemy",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "httpx",
    "tenacity",
    "pdfplumber",
    "pypdf",
    "reportlab",
    "openai",
    "anthropic",
    "google-genai",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
