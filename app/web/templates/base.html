<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AP Automation Agent{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  {# Show 4xx pages (like "cannot be edited") instead of htmx's default of ignoring them. #}
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"...","swap":true}]}'>
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body hx-boost="true">
  <header class="topbar">
    <a class="brand" href="/queue">AP Automation Agent</a>
    <nav>
      <a href="/queue">Approval queue</a>
      <a href="/receivables/payments">Payment review</a>
      <a href="/receivables/aging">AR aging</a>
      <a href="/receivables/risk">AR risk</a>
      <a href="/receivables/reminders">Reminders</a>
      <a href="/settings">Settings</a>
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Synthetic demo data only. Every vendor and invoice is fictional.</footer>
</body>
</html>
